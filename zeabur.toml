# Zeabur service config: builds the root Dockerfile (UI + API in one service).
name = "shadowbuyer-main-street"

[build]
dockerfile = "Dockerfile"

[run]
port = 8000
healthcheck = "/healthz"

[env]
# All optional. Empty = deterministic mock for that service.
ANTHROPIC_API_KEY = ""
STRIPE_SECRET_KEY = ""          # must be sk_test_...; live keys are refused
TWILIO_ACCOUNT_SID = ""
TWILIO_AUTH_TOKEN = ""
TWILIO_FROM_NUMBER = ""
